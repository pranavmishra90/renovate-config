name: renovate

on:
  # schedule:
  #   - cron: "@daily"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: ghcr.io/renovatebot/renovate@1ffc71775d95bd2233bf5a867744c5a92d845b5928dee93f5bb22ced956e4e38 #44.176.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - run: |
          git config user.name "Renovate Bot"
          git config user.email "renovate-bot@mishracloud.com"
      - run: renovate
        env:
          RENOVATE_CONFIG_FILE: "./config.js"
          LOG_LEVEL: "info"
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN_READ_ONLY }}
