name: renovate

on:
  schedule:
    - cron: "@daily"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: ghcr.io/renovatebot/renovate:44.56.3
    steps:
      - uses: actions/checkout@v6
      - run: renovate
        env:
          RENOVATE_CONFIG_FILE: "/workspace/mishracloud/renovate-config/config.js"
          LOG_LEVEL: "debug"
          RENOVATE_TOKEN: ${ { secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${ { secrets.GH_TOKEN_READ_ONLY }}
