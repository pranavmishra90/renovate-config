name: renovate

on:
  schedule:
    - cron: "@hourly"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: ghcr.io/renovatebot/renovate:44.59.2
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config user.name "Renovate Bot"
          git config user.email "renovate-bot@mishracloud.com"
      - run: renovate
        env:
          RENOVATE_CONFIG_FILE: "./config.js"
          LOG_LEVEL: "info"
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN_READ_ONLY }}
